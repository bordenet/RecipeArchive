name: restore-package-lock
on:
  push:
    paths:
      - ".github/lock-restore/**"
      - ".github/workflows/restore-package-lock.yml"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open PR with valid package-lock.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="cursor/restore-package-lock-f5ec"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH" origin/main

          curl -fsSL "https://raw.githubusercontent.com/bordenet/RecipeArchive/cursor/fix-package-lock-196f/package-lock.json" -o package-lock.json
          python3 -c "import json; d=json.load(open('package-lock.json')); assert len(d.get('packages',{}))>100; assert d.get('packages',{}).get('node_modules/jest-environment-jsdom',{}).get('version')=='30.5.2'; print('lock valid', len(d['packages']))"

          git add package-lock.json
          git commit -m "fix(npm): restore valid package-lock.json (jest-environment-jsdom 30.5.2)" || echo "lock already current"
          git push -u origin "$BRANCH" --force

          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR_NUMBER=$EXISTING"
          else
            URL=$(gh pr create --base main --head "$BRANCH" \
              --title "fix(npm): restore valid package-lock.json (jest-environment-jsdom 30.5.2)" \
              --body "Restores a valid package-lock.json (972 packages, jest-environment-jsdom@30.5.2) onto main. Supersedes Dependabot #270.")
            echo "PR_URL=$URL"
            echo "PR_NUMBER=${URL##*/}"
          fi
