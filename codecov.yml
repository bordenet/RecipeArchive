codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        # Allow coverage to decrease slightly as we add new code
        # The goal is to increase coverage over time, but not block PRs
        # that add well-tested code to previously untested modules
        target: auto
        threshold: 2%  # Allow up to 2% decrease
        informational: false
    patch:
      default:
        # Require new code to be reasonably well tested
        target: 50%
        threshold: 10%
        informational: true

# Define flags for different parts of the codebase
flags:
  javascript:
    paths:
      - extensions/
      - parsers/
    carryforward: true
  typescript:
    paths:
      - extensions/
      - parsers/
    carryforward: true
  go:
    paths:
      - aws-backend/
    carryforward: true
  backend:
    paths:
      - aws-backend/
    carryforward: true

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

