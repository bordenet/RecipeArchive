# SwiftLint Configuration for RecipeArchive iOS
# https://github.com/realm/SwiftLint

# Exclude third-party dependencies and generated files
excluded:
  - Pods
  - DerivedData
  - build
  - .build

# Only lint our source code
included:
  - Runner
  - RecipeArchive
  - RecipeExtension

# Opt-in rules (enable additional checks)
opt_in_rules:
  - empty_count
  - missing_docs

# Disabled rules
disabled_rules:
  - line_length  # Many valid cases for longer lines (URLs, etc.)
  - force_cast   # Sometimes necessary for iOS development
  - trailing_whitespace  # Auto-formatting handles this

# Rule configurations
type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 100
  error: 200

cyclomatic_complexity:
  warning: 15
  error: 50

# Reporting
reporter: "xcode"  # Use Xcode-compatible format
