<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Capture, organize, and manage your favorite recipes from across the web."
    />

    <!-- PWA & iOS meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Recipe Archive" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#87B554">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/touch-icon-ipad.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/touch-icon-ipad-retina.png">
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#87B554">
    <meta name="msapplication-TileImage" content="icons/ms-icon-144x144.png" />

    <title>Recipe Archive</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <!-- Loading indicator -->
    <div id="loading">
      <style>
        body {
          margin: 0;
          background-color: #FFFFFF;
        }
        @media (prefers-color-scheme: dark) {
          body {
            background-color: #000000;
          }
          #loading img {
            filter: invert(1);
          }
        }
        #loading {
          position: fixed;
          width: 100%;
          height: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          gap: 16px;
        }
        #loading img {
          width: 64px;
          height: 64px;
          animation: bounce 1s infinite;
        }
        @keyframes bounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }
      </style>
      <img src="icons/favicon-32x32.png" alt="Loading">
    </div>

    <script>
      window.addEventListener('load', function(ev) {
        // Hide loading indicator after 3 seconds or when Flutter UI appears
        var loading = document.querySelector('#loading');
        setTimeout(function() {
          loading.remove();
        }, 3000);
        
        // Remove loading when Flutter UI is ready
        window._flutter = window._flutter || {};
        window._flutter.loader = window._flutter.loader || {};
        window._flutter.loader.didCreateEngineInitializer = function(engineInitializer) {
          loading.remove();
          return engineInitializer;
        };
      });
    </script>
    
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
